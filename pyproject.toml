[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-sentinel"
version = "0.1.0"
description = "Autonomous SEC filing research agent — All Things Agentic Hackathon (Taskmaster track)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0",
]
cloud = [
    "google-adk",
    "google-cloud-storage",
    "google-cloud-firestore",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
